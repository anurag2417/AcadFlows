<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Rich Brand Gradient -->
    <linearGradient id="af-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF5238" />
      <stop offset="45%" stop-color="#DF301C" />
      <stop offset="100%" stop-color="#8F1407" />
    </linearGradient>

    <!-- Warm Amber / Gold Fluidity Gradient -->
    <linearGradient id="af-amber" x1="16" y1="46" x2="48" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF8A00" />
      <stop offset="60%" stop-color="#FFB319" />
      <stop offset="100%" stop-color="#FFDE59" />
    </linearGradient>

    <!-- Crisp Highlight Gradient for Academic Crest -->
    <linearGradient id="af-white" x1="20" y1="14" x2="44" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FDECE9" />
    </linearGradient>

    <!-- Sleek Container Bevel Ring -->
    <linearGradient id="af-ring" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.25" />
    </linearGradient>

    <!-- Elevation Glow -->
    <filter id="af-glow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#4A0500" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Premium Squircle Container -->
  <rect width="64" height="64" rx="16" fill="url(#af-bg)" />
  <rect width="62" height="62" x="1" y="1" rx="15" stroke="url(#af-ring)" stroke-width="1.5" />

  <g filter="url(#af-glow)">
    <!-- Graduation Cap / Diamond Crown -->
    <!-- Mortarboard Top -->
    <polygon points="32,14 49,22 32,30 15,22" fill="url(#af-white)" />
    
    <!-- Mortarboard 3D bevel / underside -->
    <polygon points="15,22 32,30 32,32.5 15,24.5" fill="#E8B5AD" opacity="0.9" />
    <polygon points="49,22 32,30 32,32.5 49,24.5" fill="#C98177" opacity="0.9" />

    <!-- Open Book / Ascending Wing Crest -->
    <!-- Left Wing -->
    <path
      d="M20,29.5 C24,32.5 28.5,34 31,35 L31,46 C27.5,44.5 22.5,42.5 18.5,37 L18.5,29 C19,29.1 19.5,29.3 20,29.5 Z"
      fill="url(#af-white)"
      opacity="0.96"
    />
    <!-- Right Wing -->
    <path
      d="M44,29.5 C40,32.5 35.5,34 33,35 L33,46 C36.5,44.5 41.5,42.5 45.5,37 L45.5,29 C45,29.1 44.5,29.3 44,29.5 Z"
      fill="url(#af-white)"
      opacity="0.82"
    />

    <!-- Dynamic Amber Flow Ribbon (Unifying the Base & Symbolizing Flows) -->
    <path
      d="M17.5,44 C23,37.5 30.5,36 44.5,35.5 C40,38.5 35,40.2 26.5,41 C22.5,41.4 19.5,43 17.5,44 Z"
      fill="url(#af-amber)"
    />

    <!-- Cap Tassel Knot & Flowing Cord -->
    <circle cx="32" cy="22" r="2.2" fill="url(#af-amber)" />
    <path
      d="M32,22 C39,22.5 44,25 45,29.5"
      stroke="url(#af-amber)"
      stroke-width="1.8"
      stroke-linecap="round"
      fill="none"
    />
    <circle cx="45" cy="29.5" r="1.3" fill="url(#af-amber)" />
  </g>
</svg>